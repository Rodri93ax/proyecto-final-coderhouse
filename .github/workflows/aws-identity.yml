name: Verificar acceso AWS por OIDC

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Obtener credenciales temporales
        uses: aws-actions/configure-aws-credentials@v6.2.2
        with:
          role-to-assume: arn:aws:iam::277385996330:role/github-coderhouse-deploy
          aws-region: us-east-1

      - name: Verificar identidad y acceso al estado
        run: |
          aws sts get-caller-identity --query Arn --output text
          aws s3api head-object \
            --bucket coderhouse-tfstate-277385996330-us-east-1 \
            --key coderhouse/terraform.tfstate \
            --query '{Bytes:ContentLength,Cifrado:ServerSideEncryption}' \
            --output json
