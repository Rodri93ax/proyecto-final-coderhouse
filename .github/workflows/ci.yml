name: CI - Tests y Docker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests de la API
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Ejecutar tests
        run: python -m unittest discover -s tests -v

  docker:
    name: Construir imagen Docker
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Construir imagen
        run: docker build -t coderhouse-api:${{ github.sha }} .

  sast:
    name: Seguridad SAST - Bandit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Instalar Bandit
        run: python -m pip install bandit==1.9.4

      - name: Analizar codigo Python
        run: bandit -r app.py tests/ -f txt

  dast:
    name: Seguridad DAST - ZAP
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Construir e iniciar API
        run: |
          docker build -t coderhouse-api:dast .
          docker run -d --name api-dast \
            -p 127.0.0.1:8000:8000 coderhouse-api:dast
          curl --retry 12 --retry-all-errors --retry-delay 2 --retry-max-time 60 \
            --max-time 10 -fsS http://127.0.0.1:8000/health

      - name: Preparar ZAP con la imagen del analisis inicial
        run: |
          mkdir -p reports/zap
          chmod 777 reports/zap
          ZAP_IMAGE="$(cat docs/evidencias/zap-inicial/imagen.txt)"
          if [[ ! "$ZAP_IMAGE" =~ ^ghcr.io/zaproxy/zaproxy@sha256:[a-f0-9]{64}$ ]]; then
            echo "Referencia de imagen ZAP inválida"
            exit 1
          fi
          docker pull "$ZAP_IMAGE"
          printf 'ZAP_IMAGE=%s\n' "$ZAP_IMAGE" >> "$GITHUB_ENV"
          printf '%s\n' "$ZAP_IMAGE" > reports/zap/imagen.txt

      - name: Analizar rutas y evaluar resultados
        run: |
          for route in home health metrics; do
            path="/"
            if [ "$route" != home ]; then
              path="/$route"
            fi

            code=0
            docker run --rm --network host \
              -v "$PWD/reports/zap:/zap/wrk:rw" \
              "$ZAP_IMAGE" zap-baseline.py \
              -t "http://127.0.0.1:8000$path" \
              -m 1 \
              -r "$route.html" \
              -J "$route.json" \
              > "reports/zap/$route.log" 2>&1 || code=$?

            cat "reports/zap/$route.log"
            printf '%s\n' "$code" > "reports/zap/$route.exit"

            if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
              echo "ZAP falló al analizar $route: código $code"
              exit 1
            fi

            python3 security/check_zap.py "reports/zap/$route.json"
          done

      - name: Guardar logs de la API
        if: always()
        run: |
          mkdir -p reports
          docker logs api-dast > reports/api.log 2>&1 || true

      - name: Publicar informes DAST
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dast-${{ github.sha }}
          path: reports/
          retention-days: 30
          if-no-files-found: error

      - name: Limpiar contenedor
        if: always()
        run: docker rm -f api-dast || true

  publish:
    name: Publicar imagen en GHCR
    needs: [tests, docker, sast, dast]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/rodri93ax/proyecto-final-coderhouse
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Construir imagen para publicar
        run: |
          docker build \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "$IMAGE:$GITHUB_SHA" .

      - name: Autenticar en GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io \
            -u "$GITHUB_ACTOR" --password-stdin

      - name: Publicar imagen
        run: |
          docker push "$IMAGE:$GITHUB_SHA"
          echo "Imagen publicada: \`$IMAGE:$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Cerrar sesion del registry
        if: always()
        run: docker logout ghcr.io

  deploy:
    name: Desplegar API en K3s
    needs: publish
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: deploy-coderhouse-k3s
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      AWS_PAGER: ""
      INSTANCE_ID: i-0125cbf96588912aa
      IMAGE: ghcr.io/rodri93ax/proyecto-final-coderhouse

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Obtener credenciales AWS por OIDC
        uses: aws-actions/configure-aws-credentials@v6.2.2
        with:
          role-to-assume: arn:aws:iam::277385996330:role/github-coderhouse-deploy
          aws-region: us-east-1

      - name: Comprobar instancia y agente SSM
        shell: bash
        run: |
          STATE="$(aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].State.Name' \
            --output text)"

          if [ "$STATE" != "running" ]; then
            echo "La EC2 debe estar encendida. Estado actual: $STATE"
            exit 1
          fi

          PING="$(aws ssm describe-instance-information \
            --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
            --query 'InstanceInformationList[0].PingStatus' \
            --output text)"

          if [ "$PING" != "Online" ]; then
            echo "El agente SSM debe estar Online. Estado actual: $PING"
            exit 1
          fi

      - name: Aplicar manifiestos y verificar despliegue por SSM
        shell: bash
        run: |
          python3 <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys
          import time

          def aws(*args):
              return subprocess.run(
                  ["aws", *args, "--output", "json"],
                  capture_output=True,
                  text=True,
              )

          instance = os.environ["INSTANCE_ID"]
          image = f'{os.environ["IMAGE"]}:{os.environ["GITHUB_SHA"]}'
          manifest = Path("k8s/app.yaml").read_text(encoding="utf-8")

          manifest, count = re.subn(
              r"(?m)^(\s*image:\s*)ghcr\.io/rodri93ax/proyecto-final-coderhouse:[^\s]+[ \t]*$",
              lambda match: match.group(1) + image,
              manifest,
          )

          if count != 1:
              sys.exit("Se esperaba una única imagen de la API en k8s/app.yaml.")

          encoded = base64.b64encode(manifest.encode()).decode()
          script = "\n".join([
              "set -eu",
              'DEPLOY_DIR="$(mktemp -d)"',
              'trap \'rm -rf "$DEPLOY_DIR"\' EXIT',
              f"printf '%s' '{encoded}' | base64 -d > \"$DEPLOY_DIR/app.yaml\"",
              'k3s kubectl apply -f "$DEPLOY_DIR/app.yaml"',
              "k3s kubectl -n coderhouse rollout status deployment/coderhouse-api --timeout=300s",
              "k3s kubectl -n coderhouse get deployment,pods,svc,ingress,hpa",
              "curl --retry 12 --retry-all-errors --retry-delay 2 --retry-max-time 60 --max-time 10 -fsS http://127.0.0.1/health",
              "printf '\\n'",
          ])

          parameters = {
              "commands": [script],
              "executionTimeout": ["600"],
          }
          Path("ssm-parameters.json").write_text(
              json.dumps(parameters), encoding="utf-8"
          )

          sent = aws(
              "ssm", "send-command",
              "--instance-ids", instance,
              "--document-name", "AWS-RunShellScript",
              "--comment", f'Deploy {os.environ["GITHUB_SHA"]}',
              "--timeout-seconds", "120",
              "--parameters", "file://ssm-parameters.json",
          )

          if sent.returncode:
              sys.exit(sent.stderr)

          command_id = json.loads(sent.stdout)["Command"]["CommandId"]
          print(f"Comando SSM: {command_id}", flush=True)
          print(f"Imagen: {image}", flush=True)

          deadline = time.monotonic() + 900
          previous_status = None

          while time.monotonic() < deadline:
              result = aws(
                  "ssm", "get-command-invocation",
                  "--command-id", command_id,
                  "--instance-id", instance,
              )

              if result.returncode:
                  if "InvocationDoesNotExist" in result.stderr:
                      time.sleep(10)
                      continue
                  sys.exit(result.stderr)

              invocation = json.loads(result.stdout)
              status = invocation["Status"]

              if status != previous_status:
                  print(f"Estado SSM: {status}", flush=True)
                  previous_status = status

              if status in {"Pending", "InProgress", "Delayed", "Cancelling"}:
                  time.sleep(10)
                  continue

              print(invocation.get("StandardOutputContent", ""))
              print(invocation.get("StandardErrorContent", ""), file=sys.stderr)

              if status != "Success" or invocation.get("ResponseCode") != 0:
                  sys.exit(f"Falló el despliegue: {status}")

              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                  summary.write(
                      f"### Despliegue verificado\n\n"
                      f"- Instancia: `{instance}`\n"
                      f"- Imagen: `{image}`\n"
                      f"- Comando SSM: `{command_id}`\n"
                      f"- Rollout y healthcheck: correctos\n"
                  )

              break
          else:
              sys.exit(
                  f"Se agotó la espera. Revisar el comando SSM {command_id} en AWS."
              )
          PY
