name: CI - Tests y Docker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests de la API
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Ejecutar tests
        run: python -m unittest discover -s tests -v

  docker:
    name: Construir imagen Docker
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Construir imagen
        run: docker build -t coderhouse-api:${{ github.sha }} .

  sast:
    name: Seguridad SAST - Bandit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Instalar Bandit
        run: python -m pip install bandit==1.9.4

      - name: Analizar codigo Python
        run: bandit -r app.py tests/ -f txt

  publish:
    name: Publicar imagen en GHCR
    needs: [tests, docker, sast]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/rodri93ax/proyecto-final-coderhouse
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Construir imagen para publicar
        run: |
          docker build \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "$IMAGE:$GITHUB_SHA" .

      - name: Autenticar en GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io \
            -u "$GITHUB_ACTOR" --password-stdin

      - name: Publicar imagen
        run: |
          docker push "$IMAGE:$GITHUB_SHA"
          echo "Imagen publicada: \`$IMAGE:$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Cerrar sesion del registry
        if: always()
        run: docker logout ghcr.io
