name: CI - Tests y Docker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests de la API
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Ejecutar tests
        run: python -m unittest discover -s tests -v

  docker:
    name: Construir imagen Docker
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Construir imagen
        run: docker build -t coderhouse-api:${{ github.sha }} .

  sast:
    name: Seguridad SAST - Bandit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Instalar Bandit
        run: python -m pip install bandit==1.9.4

      - name: Analizar codigo Python
        run: bandit -r app.py tests/ -f txt

  dast:
    name: Seguridad DAST - ZAP
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Construir e iniciar API
        run: |
          docker build -t coderhouse-api:dast .
          docker run -d --name api-dast \
            -p 127.0.0.1:8000:8000 coderhouse-api:dast
          curl --retry 12 --retry-all-errors --retry-delay 2 --retry-max-time 60 \
            --max-time 10 -fsS http://127.0.0.1:8000/health

      - name: Preparar ZAP con la imagen del analisis inicial
        run: |
          mkdir -p reports/zap
          chmod 777 reports/zap
          ZAP_IMAGE="$(cat docs/evidencias/zap-inicial/imagen.txt)"
          if [[ ! "$ZAP_IMAGE" =~ ^ghcr.io/zaproxy/zaproxy@sha256:[a-f0-9]{64}$ ]]; then
            echo "Referencia de imagen ZAP inválida"
            exit 1
          fi
          docker pull "$ZAP_IMAGE"
          printf 'ZAP_IMAGE=%s\n' "$ZAP_IMAGE" >> "$GITHUB_ENV"
          printf '%s\n' "$ZAP_IMAGE" > reports/zap/imagen.txt

      - name: Analizar rutas y evaluar resultados
        run: |
          for route in home health metrics; do
            path="/"
            if [ "$route" != home ]; then
              path="/$route"
            fi

            code=0
            docker run --rm --network host \
              -v "$PWD/reports/zap:/zap/wrk:rw" \
              "$ZAP_IMAGE" zap-baseline.py \
              -t "http://127.0.0.1:8000$path" \
              -m 1 \
              -r "$route.html" \
              -J "$route.json" \
              > "reports/zap/$route.log" 2>&1 || code=$?

            cat "reports/zap/$route.log"
            printf '%s\n' "$code" > "reports/zap/$route.exit"

            if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
              echo "ZAP falló al analizar $route: código $code"
              exit 1
            fi

            python3 security/check_zap.py "reports/zap/$route.json"
          done

      - name: Guardar logs de la API
        if: always()
        run: |
          mkdir -p reports
          docker logs api-dast > reports/api.log 2>&1 || true

      - name: Publicar informes DAST
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dast-${{ github.sha }}
          path: reports/
          retention-days: 30
          if-no-files-found: error

      - name: Limpiar contenedor
        if: always()
        run: docker rm -f api-dast || true

  publish:
    name: Publicar imagen en GHCR
    needs: [tests, docker, sast, dast]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/rodri93ax/proyecto-final-coderhouse
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Construir imagen para publicar
        run: |
          docker build \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "$IMAGE:$GITHUB_SHA" .

      - name: Autenticar en GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io \
            -u "$GITHUB_ACTOR" --password-stdin

      - name: Publicar imagen
        run: |
          docker push "$IMAGE:$GITHUB_SHA"
          echo "Imagen publicada: \`$IMAGE:$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Cerrar sesion del registry
        if: always()
        run: docker logout ghcr.io
