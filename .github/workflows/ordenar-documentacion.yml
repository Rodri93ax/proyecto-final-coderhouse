          import json
          import subprocess
          files = json.loads(r'''["INDICE.md", "PFArrocha.pdf", "analisis.md", "api.log", "aws-health.txt", "aws-oidc-success.txt", "ci-cd-success.png", "ci-dast-success.txt", "consola (2).txt", "consola.txt", "deploy-github-ssm.txt", "deploy-security.txt", "ghcr-local.txt", "github-trust.json", "grafana-api.png", "grafana-hpa-carga.png", "health.exit", "health.html", "health.json", "health.log", "home.exit", "home.html", "home.json", "home.log", "hpa-carga.txt", "hpa-final.txt", "hpa-prueba.txt", "imagen (3).txt", "imagen.txt", "informe-fuente.md", "k8s-deploy.txt", "k8s-metricas.txt", "metrics.exit", "metrics.html", "metrics.json", "metrics.log", "monitoring-install.txt", "reporte (4).html", "reporte (5).json", "reporte.html", "reporte.json", "reproduccion-aws.md", "resultado (6).txt", "resultado.txt", "revision-documental.txt", "ssm-deploy.json", "terraform-apply.txt", "terraform-fix-network.txt", "terraform-github-import.txt", "terraform-github-plan.txt", "terraform-plan-final.txt", "terraform-provision.json", "terraform-s3-plan.txt", "terraform-state.json", "tests-local.txt", "tests-security.txt", "trafico-api.txt", "zap (1).yaml", "zap (7).yaml", "zap.yaml"]''')
          for source in files:
              tracked = subprocess.run(["git", "ls-files", "--", source], capture_output=True, text=True, check=True)
              if tracked.stdout.strip():
                  subprocess.run(["git", "add", "-A", "--", source], check=True)
          PYTHON
          if git diff --cached --quiet; then
            echo "La documentacion ya estaba ordenada."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: ordenar informe y evidencias en docs [skip ci]"
          git push origin HEAD:main
