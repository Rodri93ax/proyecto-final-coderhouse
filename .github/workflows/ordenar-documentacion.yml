          def digest(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()
          
          pending = []
          errors = []
          for source, target, expected in files:
              src, dst = Path(source), Path(target)
              if not src.exists():
                  if not dst.is_file() or digest(dst) != expected:
                      errors.append(f"Falta el archivo esperado: {source} / {target}")
                  continue
              if not src.is_file() or digest(src) != expected:
                  errors.append(f"El archivo cambió desde la revisión: {source}")
              elif dst.exists() and (not dst.is_file() or digest(dst) != expected):
                  errors.append(f"El destino tiene otro contenido: {target}")
              else:
                  pending.append((src, dst))
          
          # Revisar todos los archivos antes de modificar cualquiera.
          if errors:
              raise SystemExit("\n".join(errors))
          
          moved = duplicates = 0
          for src, dst in pending:
              if dst.exists():
                  src.unlink()  # Copia idéntica ya conservada en docs.
                  duplicates += 1
                  print(f"Duplicado retirado: {src}; conservado en {dst}")
              else:
                  dst.parent.mkdir(parents=True, exist_ok=True)
                  src.rename(dst)
                  moved += 1
                  print(f"Movido: {src} -> {dst}")
          
          print(f"Resultado: {moved} movidos, {duplicates} duplicados retirados.")
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
